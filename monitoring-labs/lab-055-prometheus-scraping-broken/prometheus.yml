# Prometheus configuration — BROKEN
global:
  scrape_interval: 600s
  evaluation_interval: 600s

scrape_configs:
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  - job_name: 'app'
    static_configs:
      - targets: ['app1:9090', 'app2:9090']

    metrics_path: '/api/metrics'

  - job_name: 'node'
    static_configs:
      - targets: ['node_exporter:9100']

# =============================================================================
# DEPLOYMENT (Frontend) — Manages the nginx pods
# =============================================================================
# This Deployment runs our frontend nginx containers. The structure is very
# similar to the backend Deployment — the main differences are:
#   - Different container image (nginx instead of Flask)
#   - Different port (80 instead of 5000)
#   - No environment variables needed (nginx reads from its config file)
#   - No database connection, so health checks hit "/" instead of "/api/health"
# =============================================================================

apiVersion: apps/v1
kind: Deployment

metadata:
  name: frontend
  namespace: multi-tier-app
  labels:
    app: frontend
    tier: presentation

spec:
  # Two replicas for redundancy, matching the project requirements.
  replicas: 2

  selector:
    matchLabels:
      app: frontend

  # Same rolling update strategy as the backend — gradual replacement
  # with no downtime.
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 1

  template:
    metadata:
      labels:
        app: frontend
        tier: presentation
    spec:
      containers:
        - name: frontend

          # Same note as the backend: in production this would be a full
          # registry URL like myregistry.azurecr.io/multi-tier-frontend:v1.0.0
          image: multi-tier-frontend:latest
          imagePullPolicy: IfNotPresent

          ports:
            - containerPort: 80
              name: http

          # =================================================================
          # HEALTH PROBES
          # =================================================================
          # For nginx, we can just check if port 80 is responding.
          # We use "/" since nginx serves our index.html there.
          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 3    # Nginx starts almost instantly
            periodSeconds: 10

          livenessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 15

          # =================================================================
          # RESOURCE MANAGEMENT
          # =================================================================
          # Nginx is very lightweight — it can serve thousands of requests
          # per second with minimal memory. These limits are generous for
          # a static site.
          resources:
            requests:
              memory: "64Mi"    # 64 MB minimum — nginx is very lean
              cpu: "50m"        # 0.05 CPU cores minimum
            limits:
              memory: "128Mi"   # 128 MB maximum
              cpu: "100m"       # 0.1 CPU cores maximum

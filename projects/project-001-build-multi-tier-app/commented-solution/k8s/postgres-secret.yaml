# =============================================================================
# SECRET — Stores sensitive data like passwords, tokens, and keys
# =============================================================================
# Secrets are Kubernetes' way of handling sensitive configuration separately
# from your application code. The values are base64-encoded (NOT encrypted
# by default — base64 is just encoding, not security). In production, you'd
# use something like HashiCorp Vault or AWS Secrets Manager for real encryption.
#
# Why not just put the password in the Deployment YAML? Because:
#   1. Secrets can be updated without redeploying your app
#   2. You can control who has access to Secrets via RBAC (Role-Based Access)
#   3. It keeps passwords out of your Git history (in a real project, you'd
#      NOT commit this file — we're doing it here for learning purposes only)
# =============================================================================

apiVersion: v1
kind: Secret

metadata:
  # Name we'll reference when mounting this Secret into our pods.
  name: postgres-secret

  # Must match our namespace so it lives in the right "room".
  namespace: multi-tier-app

  labels:
    app: postgres
    tier: database

# "Opaque" is the default Secret type — it just means "arbitrary key-value data".
# Other types exist for specific use cases like TLS certificates or Docker registry
# credentials, but Opaque works for database passwords.
type: Opaque

# Each key-value pair under "data" must be base64-encoded.
# To encode a value yourself, run:  echo -n "mypassword" | base64
# To decode it back:                echo "bXlwYXNzd29yZA==" | base64 -d
#
# IMPORTANT: The "-n" flag in echo prevents a trailing newline character from
# being included in the encoded value — without it, your password would
# silently have a newline appended and things would break in confusing ways.
data:
  # "cG9zdGdyZXM=" is base64 for "postgres" (the default superuser name)
  POSTGRES_USER: cG9zdGdyZXM=

  # "c2VjdXJlcGFzc3dvcmQxMjM=" is base64 for "securepassword123"
  POSTGRES_PASSWORD: c2VjdXJlcGFzc3dvcmQxMjM=

  # "bXVsdGl0aWVyZGI=" is base64 for "multitierdb" (our database name)
  POSTGRES_DB: bXVsdGl0aWVyZGI=

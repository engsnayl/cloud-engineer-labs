# =============================================================================
# NAMESPACE — A virtual "folder" inside your Kubernetes cluster
# =============================================================================
# Namespaces let you group related resources together and keep them isolated
# from other workloads. Think of it like having separate rooms in a house —
# each room (namespace) holds its own furniture (pods, services, etc.).
#
# Why bother? Without a namespace, everything lands in "default", which gets
# messy fast. Namespaces also let you set resource quotas and access controls
# per-project.
# =============================================================================

# Every K8s manifest starts with apiVersion and kind.
# "apiVersion: v1" means this is part of the core, stable Kubernetes API.
apiVersion: v1

# "kind" tells Kubernetes what type of resource to create.
kind: Namespace

# "metadata" holds identifying information about this resource.
metadata:
  # The name of our namespace — all resources for this project will live here.
  # We'll reference "multi-tier-app" in every other manifest file.
  name: multi-tier-app

  # Labels are key-value tags you attach to resources.
  # They don't change behaviour, but they make it easy to find and filter
  # resources later (e.g., "show me everything for project-001").
  labels:
    project: multi-tier-app
    environment: development

# =============================================================================
# SERVICE (Database) — Gives pods a stable network address
# =============================================================================
# Pods are temporary — they get random IP addresses that change every time
# they restart. A Service gives you a fixed DNS name (like "postgres") that
# always routes to the right pod(s), no matter how many times they restart.
#
# This is a "headless" Service (clusterIP: None), which is the standard
# pattern for StatefulSets. Instead of load-balancing across pods, it gives
# each pod its own DNS entry: postgres-0.postgres.multi-tier-app.svc.cluster.local
#
# Since we only have one replica, our backend can simply connect to "postgres"
# and it will resolve to our single database pod.
# =============================================================================

apiVersion: v1
kind: Service

metadata:
  name: postgres
  namespace: multi-tier-app
  labels:
    app: postgres
    tier: database

spec:
  # "clusterIP: None" makes this a headless Service.
  # Normal Services get a virtual IP that load-balances traffic.
  # Headless Services skip the virtual IP and let DNS resolve directly
  # to the pod IPs — required for StatefulSets.
  clusterIP: None

  # "selector" determines which pods this Service routes traffic to.
  # Any pod with the label "app: postgres" will receive traffic sent
  # to this Service's DNS name.
  selector:
    app: postgres

  # "ports" defines which port(s) the Service accepts traffic on.
  ports:
    - port: 5432          # The port the Service listens on
      targetPort: 5432    # The port on the pod to forward traffic to
      protocol: TCP       # TCP is the default; PostgreSQL uses TCP
      name: postgres      # A human-friendly name for this port

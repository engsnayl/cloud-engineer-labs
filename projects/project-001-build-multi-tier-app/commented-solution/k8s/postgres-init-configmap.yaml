# =============================================================================
# CONFIGMAP (Database Init Script) — Non-sensitive configuration data
# =============================================================================
# A ConfigMap is like a Secret, but for data that ISN'T sensitive.
# Here we're using it to store a SQL script that will run automatically
# when PostgreSQL starts up for the first time.
#
# How does the auto-run work? The official PostgreSQL Docker image looks for
# any .sql files inside /docker-entrypoint-initdb.d/ and executes them in
# alphabetical order on first boot. We'll mount this ConfigMap into that
# directory in our StatefulSet.
# =============================================================================

apiVersion: v1
kind: ConfigMap

metadata:
  name: postgres-init-script

  # Same namespace as everything else in our project.
  namespace: multi-tier-app

  labels:
    app: postgres
    tier: database

# The "data" section holds key-value pairs. Here, the key is the filename
# and the value is the entire contents of the SQL file.
data:
  # This key becomes the filename when mounted as a volume.
  # So "init.sql" will appear as /docker-entrypoint-initdb.d/init.sql
  # inside the PostgreSQL container.
  init.sql: |
    -- =======================================================================
    -- DATABASE INITIALIZATION SCRIPT
    -- =======================================================================
    -- This script runs ONCE — only when PostgreSQL is initialized for the
    -- first time (i.e., the data directory is empty). If you restart the pod
    -- and the PersistentVolume still has data, this script will NOT re-run.
    -- =======================================================================

    -- Create a table to store items for our API to serve.
    -- "IF NOT EXISTS" is a safety net — it prevents an error if the table
    -- already exists (defensive coding).
    CREATE TABLE IF NOT EXISTS items (
        -- "SERIAL" auto-increments: first row gets id=1, next gets id=2, etc.
        -- "PRIMARY KEY" means this column uniquely identifies each row.
        id SERIAL PRIMARY KEY,

        -- "VARCHAR(255)" is a text field with a max length of 255 characters.
        -- "NOT NULL" means this field is required — you can't insert a row
        -- without providing a name.
        name VARCHAR(255) NOT NULL,

        -- "TEXT" is an unlimited-length text field (good for descriptions).
        description TEXT,

        -- "TIMESTAMP" stores date + time.
        -- "DEFAULT CURRENT_TIMESTAMP" automatically fills in the current
        -- date/time when a new row is inserted.
        created_at TIMESTAMP DEFAULT CURRENT_TIMESTAMP
    );

    -- Seed the table with some sample data so the API has something to return.
    -- Without this, /api/data would return an empty list on first deploy.
    INSERT INTO items (name, description) VALUES
        ('Kubernetes Pod', 'The smallest deployable unit in Kubernetes'),
        ('Docker Container', 'A lightweight, standalone package of software'),
        ('Helm Chart', 'A package manager for Kubernetes applications');

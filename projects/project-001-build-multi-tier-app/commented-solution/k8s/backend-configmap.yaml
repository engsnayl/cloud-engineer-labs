# =============================================================================
# CONFIGMAP (Backend) — Database connection settings for the API
# =============================================================================
# This ConfigMap stores the non-sensitive database connection details that
# our Flask backend needs. Things like the hostname and port aren't secrets,
# so they belong in a ConfigMap rather than a Secret.
#
# Why use a ConfigMap instead of hardcoding these in the Deployment?
#   1. Single source of truth — if the database hostname changes, you update
#      ONE ConfigMap instead of hunting through Deployment files
#   2. Environment separation — you can have different ConfigMaps for dev,
#      staging, and production without changing your container image
#   3. The app code just reads environment variables — it doesn't care
#      whether they come from a ConfigMap, Secret, or manual entry
# =============================================================================

apiVersion: v1
kind: ConfigMap

metadata:
  name: backend-config
  namespace: multi-tier-app
  labels:
    app: backend
    tier: api

# "data" holds our key-value configuration pairs.
# Each key becomes an environment variable in the container.
data:
  # The database hostname. Inside Kubernetes, Services create DNS entries
  # that pods can use to find each other. "postgres" here refers to the
  # Service named "postgres" in the same namespace.
  # Full DNS would be: postgres.multi-tier-app.svc.cluster.local
  # But within the same namespace, just "postgres" is enough.
  DB_HOST: "postgres"

  # Standard PostgreSQL port. Only change this if you're running PostgreSQL
  # on a non-standard port (unusual).
  DB_PORT: "5432"

  # The name of our database — must match what we set in the postgres Secret.
  DB_NAME: "multitierdb"

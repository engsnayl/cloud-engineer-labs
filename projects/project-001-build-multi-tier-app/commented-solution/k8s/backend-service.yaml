# =============================================================================
# SERVICE (Backend) — Load balances traffic across backend pods
# =============================================================================
# Unlike the headless database Service, this is a standard ClusterIP Service.
# It gets a virtual IP address inside the cluster and load-balances incoming
# requests across all healthy backend pods.
#
# When the frontend (nginx) sends a request to "http://backend:5000/api/data",
# this Service receives it and forwards it to one of our 2 backend pods.
# The choice of which pod is typically round-robin (takes turns).
# =============================================================================

apiVersion: v1
kind: Service

metadata:
  name: backend
  namespace: multi-tier-app
  labels:
    app: backend
    tier: api

spec:
  # "ClusterIP" is the default Service type. It's only accessible from INSIDE
  # the cluster — pods can reach it, but the outside world cannot.
  # Other types: NodePort (opens a port on every node), LoadBalancer (creates
  # a cloud load balancer), ExternalName (DNS alias to an external service).
  type: ClusterIP

  # Route traffic to any pod with the label "app: backend".
  # This matches the labels on our backend Deployment's pod template.
  selector:
    app: backend

  ports:
    - port: 5000          # Port the Service listens on (what other pods use)
      targetPort: 5000    # Port on the backend pod to forward to
      protocol: TCP
      name: http

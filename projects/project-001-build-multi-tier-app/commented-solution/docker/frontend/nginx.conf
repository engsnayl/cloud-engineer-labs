# =============================================================================
# NGINX CONFIGURATION — Web server and reverse proxy
# =============================================================================
# Nginx (pronounced "engine-X") serves two roles in our architecture:
#   1. WEB SERVER — Serves static files (HTML, CSS, JS) directly to browsers
#   2. REVERSE PROXY — Forwards API requests to the backend Flask service
#
# Why use nginx as a reverse proxy instead of having the browser call the
# backend directly? It gives you one single entry point, handles SSL
# termination, enables caching, and lets you change the backend without
# the frontend knowing. It's a very common production pattern.
# =============================================================================

# "events" block configures how nginx handles connections at a low level.
events {
    # Maximum number of simultaneous connections each worker process can handle.
    # 1024 is a sensible default for most workloads.
    worker_connections 1024;
}

# "http" block contains all the web server configuration.
http {

    # "include mime.types" loads a file that maps file extensions to Content-Type
    # headers. Without this, nginx wouldn't know that .css files should be served
    # as text/css, and browsers would refuse to apply your stylesheets.
    include       /etc/nginx/mime.types;

    # If nginx can't determine the file type, fall back to this generic type.
    # "application/octet-stream" tells the browser to download the file
    # rather than trying to display it.
    default_type  application/octet-stream;

    # "server" block defines a virtual server — a set of rules for handling
    # requests that arrive on a specific port and/or domain name.
    server {

        # Listen on port 80 (standard HTTP port) on all network interfaces.
        listen 80;

        # "server_name _" is a wildcard — accept requests for ANY domain name.
        # In production, you'd set this to your actual domain (e.g., myapp.com).
        server_name _;

        # =================================================================
        # LOCATION BLOCKS — URL routing rules
        # =================================================================
        # Nginx processes these top-to-bottom. More specific paths should come
        # first. Each "location" block says: "when a request URL matches this
        # pattern, do THIS."

        # --- Route 1: API requests → forward to backend ---
        # Any request starting with /api/ gets proxied to our Flask backend.
        # The browser thinks it's talking to nginx, but nginx is secretly
        # forwarding the request to a completely different service.
        location /api/ {
            # "proxy_pass" tells nginx to forward this request to another server.
            # "backend" is the Kubernetes Service name for our Flask pods.
            # Port 5000 matches the backend Service port.
            # Kubernetes DNS resolves "backend" to the Service's cluster IP.
            proxy_pass http://backend:5000;

            # These headers ensure the backend receives the ORIGINAL client's
            # information, not nginx's details. Without these, the backend would
            # see every request as coming from nginx's IP address.

            # Pass along the original Host header from the client's request.
            proxy_set_header Host $host;

            # Pass the real client IP address (not nginx's IP).
            proxy_set_header X-Real-IP $remote_addr;

            # X-Forwarded-For is a chain of all proxies the request passed through.
            # $proxy_add_x_forwarded_for appends the client's IP to any existing chain.
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

            # Tell the backend whether the original request used HTTP or HTTPS.
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # --- Route 2: Everything else → serve static files ---
        # Requests that DON'T start with /api/ are treated as requests for
        # static files (HTML, CSS, images, etc.).
        location / {
            # "root" sets the directory where nginx looks for files.
            # A request for "/" looks for /usr/share/nginx/html/index.html.
            root /usr/share/nginx/html;

            # "index" specifies the default file to serve when someone
            # requests a directory (/) rather than a specific file.
            index index.html;

            # "try_files" tells nginx to:
            #   1. Try to serve the exact file requested ($uri)
            #   2. Try the request as a directory ($uri/)
            #   3. If neither exists, serve index.html (good for single-page apps)
            try_files $uri $uri/ /index.html;
        }
    }
}

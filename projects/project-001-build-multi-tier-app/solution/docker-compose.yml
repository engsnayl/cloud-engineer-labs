services:
  database:
    image: postgres:15
    container_name: multi-tier-postgres
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: postgres
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./docker/database/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped

  backend:
    build:
      context: ./docker/backend
      dockerfile: Dockerfile
    image: multi-tier-backend:dev
    container_name: multi-tier-backend
    environment:
      DB_HOST: database
      DB_PORT: "5432"
      DB_NAME: postgres
      DB_USER: postgres
      DB_PASSWORD: ${DB_PASSWORD}
      APP_PORT: "5000"
    depends_on:
      database:
        condition: service_healthy
    restart: unless-stopped

  frontend:
    build:
      context: ./docker/frontend
      dockerfile: Dockerfile
    image: multi-tier-frontend:dev
    container_name: multi-tier-frontend
    ports:
      - "8080:8080"
    depends_on:
      backend:
        condition: service_started
    restart: unless-stopped

volumes:
  postgres-data:

# =============================================================================
# nginx.conf — Nginx configuration for the frontend service
# =============================================================================
# Nginx (pronounced "engine-x") is a high-performance web server that we use
# for two purposes here:
#   1. Serve static files (our HTML/CSS/JS frontend)
#   2. Reverse proxy — forward /api/ requests to the backend Flask service
#
# A "reverse proxy" sits in front of your backend and forwards requests to it.
# This is useful because:
#   - The browser only talks to ONE server (nginx on port 80)
#   - Nginx handles /api/ routing to the backend transparently
#   - No CORS issues (everything appears to come from the same origin)
#   - In production, nginx can add SSL, caching, rate limiting, etc.
# =============================================================================

# ---------------------------------------------------------------------------
# SERVER BLOCK
# ---------------------------------------------------------------------------
# A "server" block defines a virtual host — a set of rules for handling
# requests that arrive on a specific port (and optionally, hostname).
# You can have multiple server blocks for different domains/ports.
server {

    # -----------------------------------------------------------------------
    # LISTEN DIRECTIVE
    # -----------------------------------------------------------------------
    # Tell nginx to listen on port 80 (standard HTTP port) on all interfaces.
    # In Docker, this is the port inside the container. We map it to 8080
    # externally in docker-compose (ports: "8080:80") because:
    #   - Port 80 on the Pi may already be used by k3s Traefik ingress
    #   - Using a non-privileged port (8080) avoids permission issues
    listen 80;

    # -----------------------------------------------------------------------
    # SERVER NAME
    # -----------------------------------------------------------------------
    # server_name defines which hostname(s) this server block responds to.
    # "localhost" is fine for development and when accessed by IP address.
    # In production, you'd set this to your actual domain (e.g., myapp.com).
    # The underscore "_" is a catch-all that matches any hostname.
    server_name _;

    # -----------------------------------------------------------------------
    # LOCATION /api/ — Reverse Proxy to Backend
    # -----------------------------------------------------------------------
    # "location" blocks match request URLs. When someone requests /api/anything,
    # nginx forwards (proxies) the request to the backend service.
    #
    # The URL matching is prefix-based: /api/ matches /api/health, /api/data, etc.
    location /api/ {

        # proxy_pass — The upstream server to forward requests to.
        # "backend" is the Docker Compose service name (or Kubernetes service name).
        # Docker's built-in DNS resolves "backend" to the backend container's IP.
        # The trailing slash is important! It strips the /api/ prefix, so:
        #   Request to nginx: GET /api/health
        #   Forwarded to backend: GET /api/health
        # (In this case we keep the /api/ prefix because our Flask routes include it.)
        proxy_pass http://backend:5000;

        # proxy_set_header — Pass important headers to the backend.
        # Without these, the backend only sees requests coming from nginx's IP,
        # not the original client's IP.

        # Host: The original hostname from the client's request.
        # $host is an nginx variable containing the request's Host header.
        proxy_set_header Host $host;

        # X-Real-IP: The actual client IP address.
        # $remote_addr is the IP of whoever connected to nginx.
        proxy_set_header X-Real-IP $remote_addr;

        # X-Forwarded-For: A chain of all proxy IPs the request passed through.
        # If there are multiple proxies, this header accumulates them.
        # $proxy_add_x_forwarded_for appends the current client IP to the chain.
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

        # X-Forwarded-Proto: Whether the original request was HTTP or HTTPS.
        # $scheme is "http" or "https" — the backend can use this to know
        # if it should generate http:// or https:// URLs.
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # -----------------------------------------------------------------------
    # LOCATION / — Serve Static Files (Frontend)
    # -----------------------------------------------------------------------
    # This catches all requests that DON'T match /api/ (which is more specific
    # and takes priority). It serves our static HTML/CSS/JS files.
    location / {

        # root — The directory containing our static files.
        # This is where we COPY'd index.html in the Dockerfile.
        root /usr/share/nginx/html;

        # index — The default file to serve when someone requests a directory.
        # So requesting "/" serves "/usr/share/nginx/html/index.html".
        index index.html;

        # try_files — Try serving files in order, fall back to index.html.
        # $uri: Try the exact path requested (e.g., /styles.css)
        # $uri/: Try as a directory (e.g., /images/ -> /images/index.html)
        # /index.html: If nothing matches, serve index.html (SPA fallback).
        #
        # This "SPA fallback" pattern is essential for single-page apps that
        # use client-side routing (React Router, Vue Router, etc.). Without it,
        # refreshing on /dashboard would return a 404 because there's no
        # dashboard.html file — the routing is all in JavaScript.
        try_files $uri $uri/ /index.html;
    }
}

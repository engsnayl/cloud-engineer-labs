# =============================================================================
# database-secret.yaml — Kubernetes Secret for PostgreSQL credentials
# =============================================================================
# Secrets store sensitive data (passwords, API keys, TLS certificates) in
# Kubernetes. They're similar to ConfigMaps but with key differences:
#   - Values are base64-encoded (NOT encrypted — this is encoding, not security!)
#   - Kubernetes can restrict access to Secrets via RBAC (Role-Based Access Control)
#   - They're stored in etcd (Kubernetes' database) and can be encrypted at rest
#   - They're mounted as files or environment variables in pods
#
# IMPORTANT SECURITY NOTES:
#   - base64 is NOT encryption! Anyone with cluster access can decode these.
#     Run: echo "c2VjdXJlcGFzc3dvcmQxMjM=" | base64 -d  -> "securepassword123"
#   - In production, use tools like:
#     * Sealed Secrets (Bitnami) — encrypts secrets so they're safe in Git
#     * External Secrets Operator — pulls secrets from AWS Secrets Manager, Vault, etc.
#     * SOPS (Mozilla) — encrypts YAML files with AWS KMS, GCP KMS, or PGP
#   - NEVER commit real passwords to Git! This file uses dummy passwords for learning.
#
# To base64-encode a value: echo -n "myvalue" | base64
#   The -n flag is critical! Without it, echo adds a newline and your password
#   becomes "myvalue\n" which will fail authentication.
# =============================================================================
apiVersion: v1
kind: Secret
metadata:
  name: postgres-secret           # Name referenced by pods/deployments
  namespace: multi-tier-app       # Must match our namespace
  labels:
    app: postgres
    tier: database
type: Opaque                      # "Opaque" = generic secret (vs. TLS, Docker registry, etc.)
data:
  # base64-encoded values. Decode: echo "<value>" | base64 -d
  # Encode: echo -n "<value>" | base64

  POSTGRES_USER: cG9zdGdyZXM=                  # "postgres"
  # How we encoded it: echo -n "postgres" | base64 -> cG9zdGdyZXM=

  POSTGRES_PASSWORD: c2VjdXJlcGFzc3dvcmQxMjM=  # "securepassword123"
  # How we encoded it: echo -n "securepassword123" | base64 -> c2VjdXJlcGFzc3dvcmQxMjM=

  POSTGRES_DB: bXVsdGl0aWVyZGI=                 # "multitierdb"
  # How we encoded it: echo -n "multitierdb" | base64 -> bXVsdGl0aWVyZGI=

# =============================================================================
# ALTERNATIVE: Use "stringData" instead of "data" to avoid manual base64 encoding.
# Kubernetes will encode it for you automatically:
#
#   stringData:
#     POSTGRES_USER: postgres
#     POSTGRES_PASSWORD: securepassword123
#     POSTGRES_DB: multitierdb
#
# We used "data" (base64) here because that's what you'll see in production
# and in most online examples, so you should know how to read/create them.
# =============================================================================

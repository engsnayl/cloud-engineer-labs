apiVersion: apps/v1
kind: Deployment
metadata:
  name: legacy-service
  namespace: production
spec:
  replicas: 3
  selector:
    matchLabels:
      app: legacy-service
  template:
    metadata:
      labels:
        app: legacy-service
    spec:
      containers:
      - name: legacy
        image: nginx:1.25-alpine
        resources:
          # Right-sized to match actual usage
          requests:
            cpu: "200m"
            memory: 128Mi
          limits:
            cpu: "400m"
            memory: 256Mi

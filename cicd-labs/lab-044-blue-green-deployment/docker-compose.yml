services:
  app-blue:
    image: myapp:v1
    ports:
      - "8001:8080"
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:8080/"]
      interval: 2s
      timeout: 2s
      retries: 5
      start_period: 2s

  app-green:
    image: myapp:v2
    ports:
      - "8002:8080"
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:8080/"]
      interval: 2s
      timeout: 2s
      retries: 5
      start_period: 2s

  router:
    image: nginx:alpine
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      app-blue:
        condition: service_healthy
      app-green:
        condition: service_healthy

services:
  app-blue:
    image: myapp:v1
    ports:
      - "8001:8080"

  app-green:
    image: myapp:v2
    ports:
      - "8002:8080"

  router:
    image: nginx:alpine
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - app-blue
      - app-green

# =============================================================================
# GitHub Actions CI/CD Pipeline for Multi-Tier Application
# =============================================================================
#
# WHAT IS GITHUB ACTIONS?
# -----------------------
# GitHub Actions is a CI/CD (Continuous Integration / Continuous Deployment)
# platform built into GitHub. It automatically runs tasks (called "workflows")
# whenever something happens in your repo -- like pushing code.
#
# Think of it as a robot that watches your repo and runs commands for you
# whenever you push changes. It builds your code, tests it, and deploys it
# so you don't have to do it manually every time.
#
# This file MUST live at the REPO ROOT under .github/workflows/ for GitHub
# Actions to detect it. It will NOT work if placed inside the project folder.
#
# ARCHITECTURE NOTE -- ARM64 vs x86_64:
# --------------------------------------
# GitHub Actions runners (the machines that execute this workflow) are x86_64
# (standard Intel/AMD architecture). This means the Docker images built here
# are x86_64 images, suitable for deploying to cloud servers (EC2, EKS, etc.).
#
# Your Raspberry Pi is ARM64 (a different CPU architecture). Images built in
# this pipeline will NOT run on the Pi. For Pi development, you build images
# locally on the Pi itself, which produces ARM64 images.
#
# In short:
#   - This pipeline  -> x86_64 images -> cloud deployment (EKS, EC2)
#   - Local Pi build -> ARM64 images  -> Pi development/testing
#
# SECRETS YOU NEED TO CONFIGURE:
# ------------------------------
# Go to your GitHub repo -> Settings -> Secrets and variables -> Actions
# and add these repository secrets:
#
#   AWS_ACCESS_KEY_ID      - Your AWS IAM user's access key ID
#                            (looks like: AKIAIOSFODNN7EXAMPLE)
#
#   AWS_SECRET_ACCESS_KEY  - Your AWS IAM user's secret access key
#                            (looks like: wJalrXUtnFEMI/K7MDENG/bPxRfiCYEXAMPLEKEY)
#
#   AWS_ACCOUNT_ID         - Your 12-digit AWS account number
#                            (looks like: 123456789012)
#                            Used to construct the ECR repository URL.
#
#   KUBE_CONFIG            - The contents of your kubeconfig file (~/.kube/config)
#                            This lets kubectl in the pipeline talk to your cluster.
#                            Base64-encode it first: cat ~/.kube/config | base64
#
# You also need to create a GitHub Environment called "production" for the
# manual approval gate. Go to Settings -> Environments -> New environment.
# Add yourself as a required reviewer.
# =============================================================================

# ---- Workflow name (shows up in the Actions tab on GitHub) ----
name: Deploy Multi-Tier App

# =============================================================================
# TRIGGER CONFIGURATION
# =============================================================================
# "on" defines WHEN this workflow runs.
# We only run when code is pushed to the "main" branch AND the changes are
# inside our project folder. This prevents the pipeline from running when
# you edit unrelated files in the repo.
on:
  push:
    branches:
      - main
    paths:
      # Only trigger when files in our project directory change
      - "projects/project-001-build-multi-tier-app/**"

# =============================================================================
# ENVIRONMENT VARIABLES
# =============================================================================
# These are available to ALL jobs in the workflow. We define them once here
# so we don't have to repeat them everywhere.
env:
  AWS_REGION: eu-west-2
  # ECR repository names -- these match what Terraform provisioned
  FRONTEND_REPO: multi-tier-frontend
  BACKEND_REPO: multi-tier-backend
  # The project directory within the repo
  PROJECT_DIR: projects/project-001-build-multi-tier-app

# =============================================================================
# JOBS (STAGES)
# =============================================================================
# Jobs are the major stages of our pipeline. Each job runs on a fresh virtual
# machine (called a "runner"). Jobs run in parallel by default unless you
# specify dependencies with "needs".
jobs:

  # ===========================================================================
  # STAGE 1: BUILD
  # ===========================================================================
  # This stage builds our Docker images. We use Docker Buildx, which is an
  # extended build tool that supports advanced features like:
  #   - Multi-platform builds (e.g., building ARM64 images on x86_64)
  #   - Build caching (speeds up repeated builds)
  #   - Better layer management
  #
  # Even though we only need x86_64 images here, Buildx is the modern
  # standard and is required by many GitHub Actions Docker tools.
  # Think of Buildx as "Docker build, but better."
  build:
    name: Build Docker Images
    # "runs-on" specifies what kind of machine to use.
    # ubuntu-latest gives us a fresh Ubuntu VM with Docker pre-installed.
    # This is an x86_64 machine provided free by GitHub (with limits).
    runs-on: ubuntu-latest

    steps:
      # --- Step 1: Get our code ---
      # "checkout" clones our repository onto the runner so we can work with it.
      # Without this, the runner has an empty workspace.
      - name: Checkout code
        uses: actions/checkout@v4

      # --- Step 2: Set up Docker Buildx ---
      # This installs and configures Buildx as the Docker builder.
      # WHY BUILDX?
      # Regular "docker build" works fine locally, but Buildx gives us:
      #   1. Build cache export/import -- speeds up CI builds dramatically
      #   2. Multi-platform support -- build for ARM64, x86_64, etc. in one go
      #   3. Better build output and progress tracking
      # In CI pipelines, Buildx is essentially the standard now.
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # --- Step 3: Build the frontend image ---
      # We build the image and tag it locally. We'll push it to ECR later
      # (in the Push stage) only if tests pass.
      # The "load: true" flag loads the image into the local Docker daemon
      # so it's available for the test stage.
      - name: Build frontend image
        uses: docker/build-push-action@v5
        with:
          context: ${{ env.PROJECT_DIR }}/docker/frontend
          push: false
          load: true
          tags: multi-tier-frontend:${{ github.sha }}
          # Cache layers to speed up future builds.
          # GitHub Actions cache keeps layers between workflow runs.
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # --- Step 4: Build the backend image ---
      - name: Build backend image
        uses: docker/build-push-action@v5
        with:
          context: ${{ env.PROJECT_DIR }}/docker/backend
          push: false
          load: true
          tags: multi-tier-backend:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ===========================================================================
  # STAGE 2: TEST
  # ===========================================================================
  # WHY TEST IN THE PIPELINE?
  # -------------------------
  # Testing in CI ensures that EVERY change is verified automatically before
  # it can be deployed. Humans forget to test; pipelines never do.
  #
  # WHAT IS A SMOKE TEST?
  # ---------------------
  # A "smoke test" is a quick, basic check that the application starts up
  # and responds. It doesn't test every feature -- it just makes sure nothing
  # is fundamentally broken. The name comes from electronics: if you plug in
  # a circuit board and smoke comes out, you know something is wrong without
  # needing to run detailed diagnostics.
  #
  # Here we:
  #   1. Start a real Postgres database (in a container)
  #   2. Start our backend (in a container, connected to Postgres)
  #   3. Hit the /api/health endpoint (does the app start?)
  #   4. Hit the /api/data endpoint (can it talk to the database?)
  #
  # If either check fails, the pipeline stops and we don't deploy broken code.
  test:
    name: Smoke Tests
    runs-on: ubuntu-latest
    # This stage needs the build stage to complete first, because we need
    # the Docker images that were built there.
    needs: [build]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # We need to rebuild images here because each job runs on a FRESH runner.
      # The build job's runner is gone, so its images are gone too.
      # (In a production setup, you'd push to a registry or use artifacts.)
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build backend image for testing
        uses: docker/build-push-action@v5
        with:
          context: ${{ env.PROJECT_DIR }}/docker/backend
          push: false
          load: true
          tags: multi-tier-backend:test
          cache-from: type=gha

      # --- Start a Postgres container for the backend to connect to ---
      # We create a Docker network so the containers can find each other by name.
      # This mimics how Kubernetes networking works (services find each other
      # by DNS name).
      - name: Create test network
        run: docker network create test-network

      - name: Start Postgres container
        run: |
          docker run -d \
            --name postgres \
            --network test-network \
            -e POSTGRES_USER=testuser \
            -e POSTGRES_PASSWORD=testpass \
            -e POSTGRES_DB=testdb \
            postgres:15-alpine

      # --- Wait for Postgres to be ready ---
      # Databases take a few seconds to initialize. If we start the backend
      # too soon, it will fail to connect.
      - name: Wait for Postgres to be ready
        run: |
          echo "Waiting for Postgres to accept connections..."
          for i in $(seq 1 30); do
            if docker exec postgres pg_isready -U testuser; then
              echo "Postgres is ready!"
              break
            fi
            echo "Attempt $i/30 -- Postgres not ready yet..."
            sleep 2
          done

      # --- Start the backend container ---
      - name: Start backend container
        run: |
          docker run -d \
            --name backend \
            --network test-network \
            -p 5000:5000 \
            -e DATABASE_URL=postgresql://testuser:testpass@postgres:5432/testdb \
            multi-tier-backend:test

      # --- Give the backend a moment to start up ---
      - name: Wait for backend to start
        run: sleep 5

      # --- SMOKE TEST 1: Health Check ---
      # This verifies the application process started and is responding to HTTP.
      # /api/health is a standard endpoint that returns 200 OK if the app is alive.
      - name: "Smoke test: Health check"
        run: |
          echo "Checking /api/health..."
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:5000/api/health)
          if [ "$STATUS" -eq 200 ]; then
            echo "Health check PASSED (HTTP $STATUS)"
          else
            echo "Health check FAILED (HTTP $STATUS)"
            echo "--- Backend logs ---"
            docker logs backend
            exit 1
          fi

      # --- SMOKE TEST 2: Data Endpoint ---
      # This goes deeper than the health check. It verifies the backend can
      # actually talk to the database and return data. This catches issues
      # like bad database migrations, connection string problems, etc.
      - name: "Smoke test: Data endpoint"
        run: |
          echo "Checking /api/data..."
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:5000/api/data)
          if [ "$STATUS" -eq 200 ]; then
            echo "Data endpoint PASSED (HTTP $STATUS)"
          else
            echo "Data endpoint FAILED (HTTP $STATUS)"
            echo "--- Backend logs ---"
            docker logs backend
            exit 1
          fi

      # --- Clean up test containers ---
      - name: Clean up
        if: always()  # Run cleanup even if tests failed
        run: |
          docker rm -f backend postgres 2>/dev/null || true
          docker network rm test-network 2>/dev/null || true

  # ===========================================================================
  # STAGE 3: PUSH TO ECR
  # ===========================================================================
  # Now that we've built and tested the images, we push them to Amazon ECR
  # (Elastic Container Registry) -- AWS's private Docker image storage.
  #
  # IMAGE TAGGING STRATEGY:
  # -----------------------
  # We tag each image with TWO tags:
  #
  #   1. The Git commit SHA (e.g., a1b2c3d4e5f6...)
  #      - IMMUTABLE: each commit gets a unique tag that never changes
  #      - TRACEABLE: you can always link a running container back to the
  #        exact code that built it ("what version is production running?"
  #        -> check the image tag -> find that commit in Git)
  #      - SAFE: deploying a specific SHA means you know exactly what you get
  #
  #   2. "latest"
  #      - MUTABLE: always points to the most recent build
  #      - CONVENIENT: useful for development and quick testing
  #      - NEVER use "latest" in production! It's ambiguous -- you can't tell
  #        which version is actually running. Always use SHA tags in production.
  #
  # Think of SHA tags as "version 1.2.3" and latest as "whatever is newest."
  push:
    name: Push to ECR
    runs-on: ubuntu-latest
    # Only push if BOTH build and test passed.
    # If tests failed, we don't want broken images in our registry.
    needs: [build, test]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # --- Configure AWS credentials ---
      # This uses the secrets you configured in GitHub to authenticate with AWS.
      # The action sets environment variables that the AWS CLI and ECR login
      # will use automatically.
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      # --- Login to ECR ---
      # ECR is a private registry -- you need to authenticate before pushing.
      # This action gets a temporary auth token from AWS and logs Docker in.
      # The token expires after 12 hours (but that's fine for a pipeline run).
      - name: Login to Amazon ECR
        id: ecr-login
        uses: aws-actions/amazon-ecr-login@v2

      # --- Build and push frontend ---
      # We rebuild here (cache makes it fast) and push directly to ECR.
      - name: Build and push frontend image
        uses: docker/build-push-action@v5
        with:
          context: ${{ env.PROJECT_DIR }}/docker/frontend
          push: true
          tags: |
            ${{ secrets.AWS_ACCOUNT_ID }}.dkr.ecr.${{ env.AWS_REGION }}.amazonaws.com/${{ env.FRONTEND_REPO }}:${{ github.sha }}
            ${{ secrets.AWS_ACCOUNT_ID }}.dkr.ecr.${{ env.AWS_REGION }}.amazonaws.com/${{ env.FRONTEND_REPO }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # --- Build and push backend ---
      - name: Build and push backend image
        uses: docker/build-push-action@v5
        with:
          context: ${{ env.PROJECT_DIR }}/docker/backend
          push: true
          tags: |
            ${{ secrets.AWS_ACCOUNT_ID }}.dkr.ecr.${{ env.AWS_REGION }}.amazonaws.com/${{ env.BACKEND_REPO }}:${{ github.sha }}
            ${{ secrets.AWS_ACCOUNT_ID }}.dkr.ecr.${{ env.AWS_REGION }}.amazonaws.com/${{ env.BACKEND_REPO }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ===========================================================================
  # STAGE 4: DEPLOY TO KUBERNETES
  # ===========================================================================
  # WHAT IS A DEPLOYMENT GATE / MANUAL APPROVAL?
  # ---------------------------------------------
  # A deployment gate is a checkpoint that PAUSES the pipeline and waits for
  # a human to approve before continuing. This is critical for production
  # deployments because:
  #
  #   1. SAFETY: Even if all tests pass, you might not want to deploy right now
  #      (e.g., it's Friday afternoon, or there's already an incident)
  #   2. REVIEW: Someone should consciously decide "yes, this should go live"
  #   3. COMPLIANCE: Many organizations require approval for production changes
  #   4. COORDINATION: You might need to notify the team before deploying
  #
  # HOW IT WORKS:
  # The "environment: production" setting tells GitHub Actions to use the
  # "production" environment, which you configure with required reviewers.
  # The pipeline will pause and show a "Review deployments" button. An
  # approved reviewer must click "Approve" before this job runs.
  #
  # Set this up: Repo Settings -> Environments -> "production" -> Add reviewers
  deploy:
    name: Deploy to Kubernetes
    runs-on: ubuntu-latest
    # Only deploy if push succeeded
    needs: [push]
    # This is the magic line that creates the approval gate.
    # GitHub will pause here and wait for manual approval.
    environment: production

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # --- Set up kubectl ---
      # kubectl is the command-line tool for talking to Kubernetes clusters.
      # We need to configure it with credentials so it can reach our cluster.
      # The KUBE_CONFIG secret contains the base64-encoded kubeconfig file.
      - name: Configure kubectl
        run: |
          # Create the .kube directory (kubectl expects config here)
          mkdir -p $HOME/.kube

          # Decode the kubeconfig from the GitHub secret and write it to disk.
          # The secret is base64-encoded because kubeconfig files contain
          # special characters that can break GitHub's secret handling.
          echo "${{ secrets.KUBE_CONFIG }}" | base64 -d > $HOME/.kube/config

          # Verify we can reach the cluster
          echo "Testing cluster connection..."
          kubectl cluster-info

      # --- Update the backend deployment ---
      # "kubectl set image" updates the container image in a Deployment
      # WITHOUT editing YAML files. It tells Kubernetes: "hey, use this new
      # image version for this container."
      #
      # Kubernetes will then perform a rolling update:
      #   1. Start new pods with the new image
      #   2. Wait for them to be healthy
      #   3. Gradually stop the old pods
      # This means zero downtime -- users never see an interruption.
      - name: Update backend deployment image
        run: |
          kubectl set image deployment/backend \
            backend=${{ secrets.AWS_ACCOUNT_ID }}.dkr.ecr.${{ env.AWS_REGION }}.amazonaws.com/${{ env.BACKEND_REPO }}:${{ github.sha }} \
            -n multi-tier-app

      # --- Update the frontend deployment ---
      - name: Update frontend deployment image
        run: |
          kubectl set image deployment/frontend \
            frontend=${{ secrets.AWS_ACCOUNT_ID }}.dkr.ecr.${{ env.AWS_REGION }}.amazonaws.com/${{ env.FRONTEND_REPO }}:${{ github.sha }} \
            -n multi-tier-app

      # --- Verify the rollout ---
      # "kubectl rollout status" watches the deployment and waits until all
      # new pods are running successfully. If the new image crashes or fails
      # health checks, this command will eventually timeout and fail --
      # letting us know the deployment had a problem.
      # The --timeout flag prevents waiting forever if something goes wrong.
      - name: Verify backend rollout
        run: |
          echo "Waiting for backend rollout to complete..."
          kubectl rollout status deployment/backend \
            -n multi-tier-app \
            --timeout=300s

      - name: Verify frontend rollout
        run: |
          echo "Waiting for frontend rollout to complete..."
          kubectl rollout status deployment/frontend \
            -n multi-tier-app \
            --timeout=300s

      # --- Show the final state ---
      # Print out what's running so we can see the deployment succeeded
      # in the GitHub Actions logs.
      - name: Show deployment status
        run: |
          echo "=== Deployment Complete ==="
          echo ""
          echo "--- Pods ---"
          kubectl get pods -n multi-tier-app
          echo ""
          echo "--- Deployments ---"
          kubectl get deployments -n multi-tier-app
          echo ""
          echo "--- Services ---"
          kubectl get services -n multi-tier-app
